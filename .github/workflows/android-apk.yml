# Builds an installable Android APK and publishes it under Releases → "TrueTick Android (latest)".
# Needs the live https site: repository variable TRUETICK_URL, or HF_SPACE (owner/space) for a Hugging Face Space.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Skips quietly until the live site exists (set HF_SPACE or TRUETICK_URL); a manual run always tries.
    if: ${{ vars.HF_SPACE != '' || vars.TRUETICK_URL != '' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Work out the live site address
        id: site
        env:
          URL: ${{ vars.TRUETICK_URL }}
          SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$URL" ] && [ -n "$SPACE" ]; then
            URL="https://$(echo "$SPACE" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[._]#-#g').hf.space"
          fi
          if [ -z "$URL" ]; then
            echo "::error::Set the repository variable HF_SPACE (or TRUETICK_URL) first."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: mobile
        env:
          TRUETICK_URL: ${{ steps.site.outputs.url }}
        run: |
          npm install --no-audit --no-fund
          node scripts/configure.mjs
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#2563ff' --iconBackgroundColorDark '#2563ff'
          node scripts/patch-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../TrueTick.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrueTick-apk
          path: mobile/TrueTick.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Install on Android: download TrueTick.apk on your phone, open it, and allow installing from this source. Opens ${{ steps.site.outputs.url }}. Built from ${GITHUB_SHA::7}."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest mobile/TrueTick.apk --clobber
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest mobile/TrueTick.apk --title "TrueTick Android (latest)" --notes "$NOTES" --prerelease=false
          fi
