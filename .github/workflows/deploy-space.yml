# Publishes TrueTick to a Hugging Face Space (free https hosting) on every push to main.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   Variable HF_SPACE  = your-hf-username/truetick
# The Space only gets what it needs to run (no tests, samples or scripts), as one fresh commit.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Space folder
        run: |
          mkdir space
          cp -r backend frontend Dockerfile .dockerignore requirements.txt space/
          {
            echo "---"
            echo "title: TrueTick"
            echo "emoji: 🛡️"
            echo "colorFrom: green"
            echo "colorTo: red"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "pinned: false"
            echo "short_description: AI scam checker built with Meta's Muse models"
            echo "---"
            echo
            cat README.md
          } > space/README.md
          find space -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          HF_USER="${HF_SPACE%%/*}"
          git push -f "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
